# ==============================================================================
# Descrição: Executa a análise diária dos ETFs da XTB (PRAB, XDEQ, IBCI) às 08:30
# e envia alertas por e-mail quando identifica sinais de cruzamento de médias
# móveis (Golden Cross / Death Cross).
# ==============================================================================

name: Alerta 08:30 Lisboa

on:
  schedule:
    - cron: '30 7 * * 1-5'  # 07:30 UTC = 08:30 Lisboa
  workflow_dispatch:        # Permite execução manual para testes

jobs:
  executar-alerta:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependências
        run: |
          pip install --upgrade pip
          pip install yfinance pandas

      - name: Executar Script de Alerta
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
        run: python alerta_etfs_0830.py
