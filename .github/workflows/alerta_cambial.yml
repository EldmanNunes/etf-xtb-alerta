name: Alerta Diário de Câmbio 08:30

on:
  schedule:
    # Executa de segunda a sexta às 08:30 GMT/UTC (Lisboa)
    - cron: '30 8 * * 1-5'
  workflow_dispatch: # Permite execução manual no GitHub se desejar

jobs:
  analise-cambio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Executar Script de Alerta Cambial
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
          GMAIL_DESTINO: ${{ secrets.GMAIL_DESTINO }}
          MOEDA_BASE: 'EUR'
          MOEDA_ALVO: 'BRL'
          SPREAD_PCT: '1.5'
          META_COMPRA: '0.0' # Altere para um valor ex.: '5.90' se quiser definir uma meta fixa
        run: |
          python alerta_cambial_0830.py
